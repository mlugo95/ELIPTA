<!--Loads the css style sheet from the static folder.-->
{% load static %}
<!DOCTYPE html>
<html lang="en">
    
<!--Header of the html page. Contains the page's title.-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="{% static 'css/public_style.css' %}" />
</head>

<!--Body of the page containing the navigation bar, log in form, and footer bar.-->
<body>
    <header class="site-header">
    <div class="brand">
        <div class="logo">
        <img src="{% static 'public_img/logo.jpg' %}" alt="ELIPTA Logo" />
        </div>
        <h1>ELIPTA</h1>
    </div>
    <nav>
        <a href="{% url 'public:home' %}"> Home </a>
        <a href="{% url 'public:about' %}"> About </a>
        <a href= "{% url 'public:contact' %}"> Contact Us </a>
    </nav>
    </header>
    <main>
    <form class="form-with-validation" action = "{% url 'public:login' %}" method = "post">
        <!--Django requests csrf token for security.-->
        {% csrf_token %}
        {{ form }}
        <!--Prevents browser from displaying "next" on the url bar.-->
        {% if request.GET.next %}
            <input type = 'hidden' name = 'next' value = "{{request.GET.next}}"/>
        {% endif %}
        <button class = "form-submit"> Submit </button>
    </form>
</main>
<footer>
    <p>
        <small
        >&copy; 2026 ELIPTA EHR. Navideon Inc. All Rights
        Reserved.</small
        >
    </p>
    </footer>
</body>
</html>
